<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      padding: 20px;
      background: #0f0f0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .header img { width: 28px; height: 28px; object-fit: contain; }
    .header h1 { font-size: 16px; font-weight: 600; }
    label {
      display: block;
      color: rgba(255,255,255,0.45);
      margin-bottom: 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 9px 12px;
      color: #fff;
      font-size: 12px;
      font-family: monospace;
      outline: none;
      margin-bottom: 10px;
    }
    input:focus { border-color: #7c3aed; }
    input::placeholder { color: rgba(255,255,255,0.2); }
    button {
      width: 100%;
      padding: 9px;
      border-radius: 10px;
      border: none;
      background: #7c3aed;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #6d28d9; }
    button:disabled { opacity: 0.4; cursor: default; }
    .status {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      min-height: 16px;
    }
    .status.ok  { color: #34d399; }
    .status.err { color: #f87171; }
    .hint {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.3);
      font-size: 11px;
      line-height: 1.5;
    }
    .hint a { color: #a78bfa; text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Dharma" />
    <h1>Dharma</h1>
  </div>

  <label for="token">Extension Token</label>
  <input id="token" type="password" placeholder="Paste your token…" autocomplete="off" />
  <button id="save">Save token</button>
  <div class="status" id="status"></div>

  <div class="hint">
    Get your token from
    <a href="https://www.dharmaautomations.com/settings" target="_blank">
      www.dharmaautomations.com/settings
    </a>
    and paste it above.
  </div>

  <script src="popup.js"></script>
</body>
</html>
