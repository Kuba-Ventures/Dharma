<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Green bubbling liquid, clipped to the flask interior -->
  <clipPath id="flask-inner">
    <path d="M40 22 V40 L25 80 Q25 90 35 90 H65 Q75 90 75 80 L60 40 V22 Z"/>
  </clipPath>
  <g clip-path="url(#flask-inner)">
    <path d="M22 60 Q30 56 38 60 Q46 64 54 60 Q62 56 70 60 Q76 62 78 60 L80 92 H20 Z" fill="#22c55e"/>
    <!-- Bubbles inside the liquid -->
    <circle cx="44" cy="78" r="3.5" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
    <circle cx="56" cy="82" r="2.5" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
    <circle cx="38" cy="70" r="2" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  </g>
  <!-- Flask outline -->
  <path d="M40 22 V40 L25 80 Q25 90 35 90 H65 Q75 90 75 80 L60 40 V22"
        fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Neck rim -->
  <line x1="37" y1="22" x2="63" y2="22" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- Orange exclamation marks above the flask -->
  <line x1="50" y1="16" x2="50" y2="4"  stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="62" y1="17" x2="68" y2="6"  stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="38" y1="17" x2="32" y2="6"  stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
</svg>
